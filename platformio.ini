; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
; default_envs = drybox_full_project
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
monitor_speed = 115200
framework = arduino
lib_deps = 
	https://github.com/bblanchon/ArduinoJson.git
	knolleary/PubSubClient@^2.8
	; bblanchon/ArduinoJson@^7.4.2
	https://github.com/Links2004/arduinoWebSockets.git
	adafruit/Adafruit GFX Library @ ^1.12.3
	olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0

[env:drybox_full_project]
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = ${common.platform}
board = ${common.board}
monitor_speed = ${common.monitor_speed}
framework = ${common.framework}
lib_deps = 
	 ${common.lib_deps}
	; arduino-libraries/ArduinoHttpClient @ ^0.6.1
	; https://github.com/bblanchon/ArduinoJson.git
	adafruit/Adafruit SSD1306@^2.5.15
	; https://github.com/Links2004/arduinoWebSockets.git
	; knolleary/PubSubClient@^2.8
; build_src_filter = +<src/main.cpp> -<src/main_tft.cpp>

[env:tft_prep]
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = ${common.platform}
board = ${common.board}
monitor_speed = ${common.monitor_speed}
framework = ${common.framework}
lib_deps = 
	${common.lib_deps}
	; knolleary/PubSubClient@^2.8
	adafruit/Adafruit ILI9341@^1.6.2
	adafruit/Adafruit SHT31 Library@^2.2.2
	; plapointe6/EspMQTTClient @ ^1.13.3
	; knolleary/PubSubClient@^2.8
	; bblanchon/ArduinoJson@^7.4.2
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/Bodmer/TFT_eWidget.git
	https://github.com/Bodmer/OpenFontRender.git
; board_build.filesystem = littlefs
build_src_filter =   +<src/main_tft.cpp> -<src/main.cpp>
