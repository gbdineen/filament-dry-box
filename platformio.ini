; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
monitor_speed = 115200
framework = arduino
; platform_packages = framework-arduinoespressif32@2.0.14
lib_deps = 
	https://github.com/bblanchon/ArduinoJson.git
	knolleary/PubSubClient@^2.8
	; bblanchon/ArduinoJson@^7.4.2
	https://github.com/Links2004/arduinoWebSockets.git
	adafruit/Adafruit GFX Library @ ^1.12.3
	olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0


[env:tft_prep]
platform = ${common.platform}
board = ${common.board}
monitor_speed = ${common.monitor_speed}
framework = ${common.framework}
; platform_packages = ${common.platform_packages}
lib_deps = 
	${common.lib_deps}
	adafruit/Adafruit SHT31 Library@^2.2.2
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/Bodmer/TFT_eWidget.git
	https://github.com/Bodmer/OpenFontRender.git
board_build.filesystem = littlefs
; build_src_filter = +<main_tft.cpp> -<main.cpp>
upload_port = /dev/cu.usbmodem5A840131371
